<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#b20d20" />
  <meta name="description" content="Próximo jogo, competições, classificações, calendários e resultados do SL Benfica." />
  <title>Benfica Match Center</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/benfica-crest.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand brand-button" id="homeButton" type="button" aria-label="Voltar ao início">
        <span class="brand-mark" aria-hidden="true"><img src="icons/benfica-crest.svg" alt="" /></span>
        <span class="brand-copy">
          <span class="eyebrow">Futebol · Equipa Principal</span>
          <strong>Benfica Match Center</strong>
        </span>
      </button>
      <div class="header-actions">
        <span class="season-chip">Época 2026/27</span>
        <span class="status-chip" id="dataStatus">Dados verificados · 22/08/2026</span>
      </div>
    </header>

    <main>
      <section id="homeView">
        <section id="nextMatchHero" class="hero-card" aria-live="polite"></section>

        <div class="section-head competition-heading">
          <div>
            <span class="section-kicker">Época 2026/27</span>
            <h2>Competições</h2>
            <p>Seleciona uma prova para ver classificação/estado, calendário e últimos resultados.</p>
          </div>
        </div>
        <section id="competitionGrid" class="competition-grid" aria-label="Competições do Benfica"></section>
      </section>

      <section id="competitionView" class="competition-view hidden" aria-live="polite">
        <button id="backButton" class="back-button" type="button">← Todas as competições</button>
        <section id="competitionHeader" class="competition-detail-header"></section>
        <nav id="detailTabs" class="detail-tabs" aria-label="Detalhes da competição">
          <button class="detail-tab active" data-detail="status" type="button">Classificação / Estado</button>
          <button class="detail-tab" data-detail="calendar" type="button">Calendário e resultados</button>
        </nav>
        <section id="competitionDetailRoot" class="detail-root"></section>
      </section>
    </main>

    <footer>
      <div>
        <strong>Benfica Match Center</strong>
        <span>Projeto não oficial. Horários sujeitos a alteração pelos organizadores.</span>
      </div>
      <div class="footer-links">
        <a href="https://www.slbenfica.pt/pt-pt/futebol/calendario" target="_blank" rel="noreferrer">Calendário oficial SL Benfica</a>
        <a href="https://www.ligaportugal.pt/" target="_blank" rel="noreferrer">Liga Portugal</a>
        <a href="https://pt.uefa.com/" target="_blank" rel="noreferrer">UEFA</a>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
