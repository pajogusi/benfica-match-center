<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#b20d20" />
  <meta name="description" content="Benfica Match Center em atualização." />
  <title>Benfica Match Center · Em atualização</title>
  <link rel="icon" href="icons/benfica-crest.svg" type="image/svg+xml" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #b20d20;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    main { max-width: 850px; }
    img { width: 120px; height: 120px; margin-bottom: 28px; }
    h1 {
      margin: 0;
      font-size: clamp(3rem, 10vw, 7rem);
      line-height: .95;
      letter-spacing: -.04em;
      text-transform: uppercase;
    }
    p {
      margin: 30px auto 0;
      max-width: 680px;
      font-size: clamp(1.1rem, 3vw, 1.6rem);
      line-height: 1.45;
      opacity: .9;
    }
  </style>
</head>
<body>
  <main>
    <img src="icons/benfica-crest.svg" alt="SL Benfica" />
    <h1>Em atualização</h1>
    <p>Estamos a preparar uma nova versão do Benfica Match Center. Voltaremos em breve com informação atualizada.</p>
  </main>
</body>
</html>
