name: Verificar aplicação
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check app.js && node --check sw.js
      - run: node --test tests/*.test.cjs
      - run: python3 -m unittest discover -s tests -p '*_test.py'
