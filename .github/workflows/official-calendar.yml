name: Atualizar calendário oficial gratuito
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-calendar
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/update_official_calendar.py
      - name: Guardar alterações verificadas
        run: |
          if ! git diff --quiet -- data/official-calendar.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/official-calendar.json
            git commit -m 'data: atualizar calendário oficial da Liga Portugal'
            git push
          fi
